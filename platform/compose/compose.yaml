name: neural-labs-${TENANT_ID:?TENANT_ID is required}

services:
  openclaw-gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE is required}
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - ${TENANT_SECRETS_ENV:?TENANT_SECRETS_ENV is required}
    environment:
      HOME: /home/node
      NODE_ENV: production
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      TZ: ${TZ:-America/Chicago}
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    ports:
      - name: gateway
        target: 18789
        host_ip: 127.0.0.1
        published: "${GATEWAY_PORT:?GATEWAY_PORT is required}"
        protocol: tcp
    volumes:
      - type: bind
        source: ${TENANT_HOME_DIR:?TENANT_HOME_DIR is required}
        target: /home/node
        bind:
          create_host_path: false
      - type: bind
        source: ${GLOBAL_SKILLS_DIR:?GLOBAL_SKILLS_DIR is required}
        target: /opt/alshival/openclaw-skills
        read_only: true
        bind:
          create_host_path: false
    networks:
      - tenant
    cap_drop:
      - NET_RAW
    pids_limit: ${GATEWAY_PIDS_LIMIT:-512}
    cpus: ${GATEWAY_CPUS:-2.0}
    mem_limit: ${GATEWAY_MEMORY:-3g}

networks:
  tenant:
    driver: bridge
