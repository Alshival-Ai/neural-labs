name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public/private repository boundary
        run: bash tests/public_boundary_test.sh
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan complete Git history for secrets
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --verbose
      - name: Scan the checked-out public tree and archives
        run: >-
          "${RUNNER_TEMP}/gitleaks" dir --redact --no-banner
          --max-archive-depth=1 .

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            control-plane/package-lock.json
            console/package-lock.json
            mcp/package-lock.json
            workspace/package-lock.json
            workspace/desktop/package-lock.json
      - run: npm ci --prefix console
      - run: npm ci --prefix control-plane
      - run: npm ci --prefix mcp
      - run: npm ci --prefix workspace
      - run: npm ci --prefix workspace/desktop
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --prefix console
          npm audit --omit=dev --prefix control-plane
          npm audit --omit=dev --prefix mcp
          npm audit --omit=dev --prefix workspace
          npm audit --omit=dev --prefix workspace/desktop
      - run: make validate
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:integration-test-only@127.0.0.1:5432/postgres
        run: npm --prefix control-plane test -- database.integration.test.ts
      - name: Build deployable images
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml build
