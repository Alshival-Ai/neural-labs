upstream neural_labs_web {
    server 127.0.0.1:4173;
    keepalive 8;
}

upstream neural_labs_control_plane {
    server 127.0.0.1:4174;
    keepalive 8;
}

upstream neural_labs_workspace {
    server 127.0.0.1:4180;
    keepalive 8;
}

upstream neural_labs_workspace_desktop {
    server 127.0.0.1:4181;
    keepalive 8;
}

map $http_upgrade $neural_labs_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;

    server_name neural-labs.ai www.neural-labs.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://neural-labs.ai$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.neural-labs.ai;

    ssl_certificate /etc/letsencrypt/live/neural-labs.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neural-labs.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://neural-labs.ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name neural-labs.ai;

    ssl_certificate /etc/letsencrypt/live/neural-labs.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neural-labs.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; media-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        proxy_pass http://neural_labs_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location ~ ^/(setup|login|signup|logout|account|admin)(/|$) {
        proxy_pass http://neural_labs_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /auth/ {
        proxy_pass http://neural_labs_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ^~ /api/ {
        client_max_body_size 32m;
        proxy_pass http://neural_labs_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neural_labs_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /control-assets/ {
        proxy_pass http://neural_labs_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /_workspace_auth {
        internal;
        # auth_request subrequests inherit the parent request metadata. Match
        # the workspace upload ceiling even though the body is never proxied,
        # otherwise Nginx rejects large uploads while entering this location.
        client_max_body_size 2g;
        proxy_pass http://neural_labs_control_plane/internal/workspace/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location = /_workspace_admin_auth {
        internal;
        client_max_body_size 2g;
        proxy_pass http://neural_labs_control_plane/internal/workspace/admin-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location = /workspace/openclaw {
        return 404;
    }

    location ^~ /workspace/openclaw/ {
        return 404;
    }

    location = /workspace/neura/socket {
        # This is the only public Gateway surface. The authenticated user id is
        # asserted by the control plane and trusted only from this proxy subnet.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        auth_request /_workspace_auth;
        auth_request_set $workspace_user_id $upstream_http_x_neural_labs_user;
        auth_request_set $workspace_user_email $upstream_http_x_neural_labs_email;
        auth_request_set $workspace_user_role $upstream_http_x_neural_labs_role;
        auth_request_set $workspace_redirect $upstream_http_x_neural_labs_redirect;
        error_page 401 = @workspace_login;

        proxy_pass http://neural_labs_workspace/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $workspace_user_id;
        proxy_set_header X-Neural-Labs-Email $workspace_user_email;
        proxy_set_header X-Neural-Labs-Role $workspace_user_role;
        proxy_set_header X-OpenClaw-Scopes "operator.read,operator.write,operator.approvals,operator.questions";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neural_labs_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /workspace/automations/socket {
        # Automation mutations require operator.admin. The control plane first
        # proves this is an active Neural Labs administrator; only then does
        # Nginx assert the narrowly granted OpenClaw service identity.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        auth_request /_workspace_admin_auth;
        auth_request_set $workspace_user_email $upstream_http_x_neural_labs_email;
        auth_request_set $workspace_redirect $upstream_http_x_neural_labs_redirect;
        error_page 401 = @workspace_login;

        proxy_pass http://neural_labs_workspace/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User "neural-labs-automations-admin";
        proxy_set_header X-Neural-Labs-Email $workspace_user_email;
        proxy_set_header X-Neural-Labs-Role "admin";
        proxy_set_header X-OpenClaw-Scopes "operator.read,operator.admin";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neural_labs_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /workspace {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;

        auth_request /_workspace_auth;
        auth_request_set $workspace_user_id $upstream_http_x_neural_labs_user;
        auth_request_set $workspace_user_email $upstream_http_x_neural_labs_email;
        auth_request_set $workspace_user_role $upstream_http_x_neural_labs_role;
        auth_request_set $workspace_redirect $upstream_http_x_neural_labs_redirect;
        error_page 401 = @workspace_login;

        proxy_pass http://neural_labs_workspace_desktop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $workspace_user_id;
        proxy_set_header X-Neural-Labs-Email $workspace_user_email;
        proxy_set_header X-Neural-Labs-Role $workspace_user_role;
        proxy_set_header Connection "";
    }

    # Sandboxed website previews have an opaque browser origin, so SameSite
    # session cookies are not reliable for stylesheet, script, font, or image
    # requests. The authenticated launch POST mints a 192-bit, expiring bearer
    # capability in this path; the workspace validates it for every read.
    location ^~ /workspace/preview/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        access_log off;

        proxy_pass http://neural_labs_workspace_desktop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Neural-Labs-Email "";
        proxy_set_header X-Neural-Labs-Role "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location ^~ /workspace/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        client_max_body_size 2g;

        auth_request /_workspace_auth;
        auth_request_set $workspace_user_id $upstream_http_x_neural_labs_user;
        auth_request_set $workspace_user_email $upstream_http_x_neural_labs_email;
        auth_request_set $workspace_user_role $upstream_http_x_neural_labs_role;
        auth_request_set $workspace_redirect $upstream_http_x_neural_labs_redirect;
        error_page 401 = @workspace_login;

        proxy_pass http://neural_labs_workspace_desktop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $workspace_user_id;
        proxy_set_header X-Neural-Labs-Email $workspace_user_email;
        proxy_set_header X-Neural-Labs-Role $workspace_user_role;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neural_labs_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @workspace_login {
        return 302 $workspace_redirect;
    }

    location = /mcp {
        return 404;
    }

    location ^~ /oauth/ {
        return 404;
    }

    location ^~ /.well-known/oauth- {
        return 404;
    }

    location / {
        proxy_pass http://neural_labs_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
