# Standalone app ingress. Replace apps.example.com and the certificate paths.
# The workspace desktop remains behind its separate authenticated vhost.
# This file is installed explicitly by the operator, never by the deploy skill.
map $http_upgrade $neural_labs_app_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name *.apps.example.com;
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name ~^(?<app>[a-z0-9][a-z0-9-]*)\.apps\.example\.com$;
    ssl_certificate /etc/letsencrypt/live/apps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:4181/__alshival_app/$app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neural_labs_app_connection;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Neural-Labs-Assertion "";
        proxy_set_header X-Neural-Labs-Session "";
        proxy_cookie_domain ~.* $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
}
